[project]
name = "astrouda"
version = "0.2.0"
requires-python = ">=3.12"
description = "Universal domain adaptation for galaxy morphology (DeepAstroUDA, arXiv:2302.02005)"
authors = [
    {name="voetberg", email="maggiev@fnal.gov"}
]
readme = "README.md"

dependencies = [
    "matplotlib>=3.8",
    "numpy>=1.26",
    "torch>=2.5",
    "torchvision>=0.20",
    "h5py>=3.10",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrouda*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: needs a CUDA device, skipped when none is available"]
